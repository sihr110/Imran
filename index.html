<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA TV — Live Channels</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #080c14; --surface: #0f1623; --card: #141d2e; --border: #1e2d47; --accent: #e63946; --accent2: #f4a261; --text: #e8eaf0; --muted: #6b7a99; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: var(--accent); }
  .player-section { padding: 2rem; max-width: 1000px; margin: 0 auto; }
  .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: none; }
  .channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
  .channel-card { background: var(--card); padding: 1rem; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); color: white; }
  .channel-card:hover { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">NOVA TV</div>
  <button onclick="resetToDefaults()" style="cursor:pointer;">🔄 Reset Data</button>
</header>

<div class="player-section">
  <div class="player-wrapper">
    <iframe id="mainPlayer" src=""></iframe>
  </div>
</div>

<div class="channels-grid" id="channelsGrid"></div>

<script src="channels.js"></script>

<script>
let channels = [];

function init() {
  const saved = localStorage.getItem('novaTV_channels');
  // If no saved data, use the data from channels.js
  channels = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_CHANNELS));
  renderChannels();
  if (channels.length > 0) playChannel(channels[0].id);
}

function renderChannels() {
  const grid = document.getElementById('channelsGrid');
  grid.innerHTML = '';
  channels.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = `${ch.flag} ${ch.name}`;
    card.onclick = () => playChannel(ch.id);
    grid.appendChild(card);
  });
}

function playChannel(id) {
  const ch = channels.find(c => c.id === id);
  if (ch) document.getElementById('mainPlayer').src = ch.url;
}

function resetToDefaults() {
  localStorage.removeItem('novaTV_channels');
  location.reload();
}

init();
</script>
</body>
</html>
